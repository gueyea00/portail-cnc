<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Ajout du logo (Armoiries du Tchad) comme favicon pour le navigateur -->
    <link rel="icon" type="image/png" href="/armoiries-tchad.png" />
    <link rel="apple-touch-icon" href="/armoiries-tchad.png" />
    
    <title>CNC Tchad — Conseil National de la Concurrence</title>
    <meta name="description" content="Le Conseil National de la Concurrence (CNC) de la République du Tchad veille au respect des règles de la concurrence et promeut un environnement économique loyal." />
    <meta name="author" content="CNC Tchad" />

    <meta property="og:title" content="CNC Tchad — Conseil National de la Concurrence" />
    <meta property="og:description" content="Autorité administrative indépendante chargée de veiller au respect des règles de la concurrence au Tchad." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/armoiries-tchad.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CNC Tchad — Conseil National de la Concurrence" />
    <meta name="twitter:image" content="/armoiries-tchad.png" />

    <!-- Google Translate widget (caché visuellement, contrôlé par notre propre menu) -->
    <!-- IMPORTANT: Ne pas mettre class="notranslate" sur <html>, sinon rien n'est traduit -->
    <style>
      /* Cache le widget Google Translate natif et sa barre de notification */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      .goog-te-banner-frame { display: none !important; }
      .skiptranslate { display: none !important; }
      body { top: 0 !important; position: static !important; }
      .goog-te-gadget { display: none !important; }
      /* Barre de notification Google Translate (nouveaux navigateurs) */
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-OiiCO { display: none !important; }
      /* Empêche que Google Translate décale le body vers le bas */
      .translated-ltr body, .translated-rtl body { top: 0 !important; }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Conteneur Google Translate widget (invisible) -->
    <div id="google_translate_element" style="display:none; position:absolute; top:-9999px; left:-9999px;"></div>

    <!-- Initialisation du widget Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'fr',
            includedLanguages: 'fr,en,ar',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
